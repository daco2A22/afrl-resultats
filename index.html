<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AFRL — Résultats Coupe de France 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#06080f;--surface:#0d1220;--surface2:#111827;
  --border:rgba(255,255,255,0.07);--accent:#e8192c;
  --accent3:#3b82f6;--text:#f0f4ff;--muted:#6b7a99;
  --gold:#fbbf24;--silver:#94a3b8;--bronze:#cd7c3a;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(232,25,44,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(232,25,44,0.025) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;z-index:0;}
body::after{content:'';position:fixed;inset:0;background:url('bg.webp') center/cover no-repeat;opacity:0.07;pointer-events:none;z-index:0;}

/* HEADER */
header{position:relative;z-index:20;background:rgba(6,8,15,0.97);border-bottom:1px solid var(--border);}
.header-inner{max-width:1300px;margin:0 auto;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:64px;}
.header-center{text-align:center;}
.header-center-label{font-family:'Rajdhani',sans-serif;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.header-center-count{font-family:'Rajdhani',sans-serif;font-size:1.1rem;font-weight:700;color:var(--text);}
.header-right{font-family:'Rajdhani',sans-serif;font-size:.8rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;}

/* HERO */
.hero{position:relative;z-index:5;text-align:center;padding:2rem 1rem 1.5rem;}
.hero-eyebrow{font-family:'Rajdhani',sans-serif;font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:.5rem;}
.hero h1{font-family:'Rajdhani',sans-serif;font-size:clamp(1.6rem,4vw,2.8rem);font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;}
.hero-line{width:60px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:.8rem auto 0;}

/* NAV PRINCIPALE */
.nav-wrap{position:sticky;top:0;z-index:30;background:rgba(6,8,15,0.97);border-bottom:1px solid var(--border);}
.nav-scroll-wrap{position:relative;max-width:1300px;margin:0 auto;}
.nav-inner{padding:0 2.2rem;display:flex;gap:.1rem;overflow-x:auto;scrollbar-width:none;}
.nav-inner::-webkit-scrollbar{display:none;}
.nav-arrow{position:absolute;top:0;bottom:1px;width:2rem;display:flex;align-items:center;justify-content:center;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;z-index:2;background:rgba(6,8,15,0.97);}
.nav-arrow.left{left:0;background:linear-gradient(90deg,rgba(6,8,15,1),rgba(6,8,15,0));}
.nav-arrow.right{right:0;background:linear-gradient(270deg,rgba(6,8,15,1),rgba(6,8,15,0));}
.nav-arrow:hover{color:var(--text);}
.tab-btn{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:.88rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:.85rem .9rem;cursor:pointer;transition:all .2s;white-space:nowrap;margin-bottom:-1px;display:flex;align-items:center;gap:.35rem;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--text);border-bottom-color:var(--accent);}
.tab-btn.tab-s1{color:#4ade80;}
.tab-btn.tab-s2{color:#f59e0b;}
.tab-btn.tab-cal{color:#60a5fa;}
.tab-btn.active.tab-s1{border-bottom-color:#4ade80;}
.tab-btn.active.tab-s2{border-bottom-color:#f59e0b;}
.tab-btn.active.tab-cal{border-bottom-color:#60a5fa;}

/* MAIN */
main{position:relative;z-index:5;max-width:1300px;margin:0 auto;padding:1.5rem;}
.panel{display:none;}
.panel.active{display:block;animation:panelIn .2s ease;}
@keyframes panelIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* SEASON HEADER */
.season-header{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:1rem 1.2rem;margin-bottom:1.2rem;display:flex;align-items:center;justify-content:space-between;}
.season-header.s2{border-color:rgba(251,191,36,.2);}
.season-title{font-family:'Rajdhani',sans-serif;font-size:1.1rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.season-title.s2{color:#f59e0b;}
.season-dates{font-size:.72rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:2px;}

/* SUB NAV */
.sub-nav{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:1.2rem;}
.sub-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:.45rem .85rem;border-radius:3px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:.3rem;white-space:nowrap;}
.sub-btn:hover{color:var(--text);}
.sub-btn.active{color:var(--text);border-color:rgba(232,25,44,.4);background:rgba(232,25,44,.05);}
.sub-btn.done{color:#4ade80;border-color:rgba(74,222,128,.2);}
.sub-btn.live{color:var(--gold);border-color:rgba(251,191,36,.2);}
.sub-btn.done.active,.sub-btn.live.active{background:rgba(255,255,255,.03);}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.dot-done{background:#4ade80;}
.dot-live{background:var(--gold);animation:blink 1.2s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}

/* SUB PANELS */
.sub-panel{display:none;}
.sub-panel.active{display:block;}

/* RALLYE HEADER */
.rallye-header{background:#0a0e1a;border:1px solid var(--border);border-radius:4px;padding:.7rem 1rem;margin-bottom:1rem;display:flex;align-items:center;gap:.75rem;}
.rallye-num{font-family:'Rajdhani',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.12em;background:var(--accent);color:#fff;padding:2px 8px;border-radius:2px;}
.rallye-name{font-family:'Rajdhani',sans-serif;font-size:.95rem;font-weight:700;color:var(--text);}
.rallye-sub{font-size:.7rem;color:var(--muted);margin-top:1px;}

/* SEC TITLE */
.sec-title{font-family:'Rajdhani',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:.75rem;margin-bottom:.9rem;margin-top:1.5rem;}
.sec-title:first-child{margin-top:0;}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border);}
.stag{padding:2px 7px;border-radius:2px;font-size:.6rem;letter-spacing:.1em;}
.stag-done{background:rgba(74,222,128,.12);color:#4ade80;}
.stag-live{background:rgba(251,191,36,.18);color:var(--gold);}
.stag-upcoming{background:rgba(107,122,153,.12);color:var(--muted);}

/* CARDS */
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.8rem;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:4px;overflow:hidden;cursor:pointer;transition:all .22s;position:relative;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),transparent);opacity:0;transition:opacity .22s;}
.card:hover{border-color:rgba(232,25,44,.3);transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.5);}
.card:hover::before{opacity:1;}
.card-head{padding:.55rem .85rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.card-label{font-family:'Rajdhani',sans-serif;font-size:.75rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;}
.card-chip{font-family:'Rajdhani',sans-serif;font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:2px;}
.chip-general{background:rgba(251,191,36,.15);color:var(--gold);}
.chip-classe{background:rgba(59,130,246,.15);color:var(--accent3);}
.chip-genclasse{background:rgba(168,85,247,.15);color:#c084fc;}
.card-img{width:100%;aspect-ratio:16/9;background:var(--surface2);overflow:hidden;display:flex;align-items:center;justify-content:center;}
.card-img img{width:100%;height:100%;object-fit:cover;}
.card-foot{padding:.45rem .85rem;display:flex;align-items:center;justify-content:space-between;}
.card-date{font-size:.68rem;color:var(--muted);}
.card-cta{font-family:'Rajdhani',sans-serif;font-size:.68rem;font-weight:600;color:var(--accent);text-transform:uppercase;}

/* EMPTY */
.empty-state{text-align:center;padding:3rem;color:var(--muted);border:1px dashed var(--border);border-radius:6px;}
.empty-state .ei{font-size:2.5rem;opacity:.15;margin-bottom:.75rem;}
.empty-state .et{font-family:'Rajdhani',sans-serif;font-size:.78rem;letter-spacing:.15em;text-transform:uppercase;}

/* S2 EMPTY */
.s2-empty{background:var(--surface);border:1px dashed rgba(251,191,36,.25);border-radius:8px;padding:2.5rem;text-align:center;}
.s2-empty .ei{font-size:2.5rem;opacity:.15;margin-bottom:.75rem;}
.s2-empty .et{font-family:'Rajdhani',sans-serif;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.s2-empty .es{font-size:.72rem;color:var(--gold);margin-top:.4rem;opacity:.8;}

/* CALENDAR */
.cal-intro{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent3);border-radius:4px;padding:1rem 1.2rem;margin-bottom:1.2rem;font-size:.82rem;color:var(--muted);line-height:1.6;}
.cal-intro strong{color:var(--text);}
.cal-grid{display:flex;flex-direction:column;gap:.4rem;}
.week-block{background:var(--surface);border:1px solid var(--border);border-radius:4px;overflow:hidden;}
.week-head{background:#0a0e1a;padding:.5rem 1rem;display:flex;align-items:center;gap:.7rem;border-bottom:1px solid var(--border);}
.week-num{font-family:'Rajdhani',sans-serif;font-size:.62rem;font-weight:700;background:var(--accent);color:#fff;padding:2px 7px;border-radius:2px;letter-spacing:.1em;}
.week-label{font-family:'Rajdhani',sans-serif;font-size:.8rem;font-weight:600;color:var(--text);}
.week-status{font-family:'Rajdhani',sans-serif;font-size:.6rem;font-weight:700;letter-spacing:.1em;padding:2px 8px;border-radius:2px;margin-left:auto;}
.ws-done{background:rgba(74,222,128,.12);color:#4ade80;}
.ws-live{background:rgba(251,191,36,.18);color:var(--gold);}
.ws-upcoming{background:rgba(107,122,153,.1);color:var(--muted);}
.week-rallyes{display:grid;grid-template-columns:1fr 1fr;}
.w-rally{padding:.6rem 1rem;display:flex;flex-direction:column;gap:.2rem;}
.w-rally.right{border-left:1px solid var(--border);}
.rtype{font-family:'Rajdhani',sans-serif;font-size:.58rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;}
.rtype-n{color:#60a5fa;}.rtype-r{color:#f87171;}
.rname{font-family:'Rajdhani',sans-serif;font-size:.85rem;font-weight:600;color:var(--text);}
.rdept{font-size:.7rem;color:var(--muted);}

/* LIGHTBOX */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:1000;flex-direction:column;backdrop-filter:blur(6px);}
.lightbox.open{display:flex;}
.lb-bar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.2rem;border-bottom:1px solid var(--border);background:rgba(6,8,15,.95);}
.lb-title{font-family:'Rajdhani',sans-serif;font-size:.85rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);}
.lb-controls{display:flex;align-items:center;gap:.5rem;}
.lb-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);height:28px;padding:0 10px;border-radius:3px;cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:.8rem;font-weight:600;transition:all .2s;}
.lb-btn:hover{background:rgba(255,255,255,.1);}
.lb-close{background:var(--surface);border:1px solid var(--border);color:var(--text);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.lb-close:hover{background:var(--accent);border-color:var(--accent);}
.lb-scroll{flex:1;overflow:auto;display:flex;justify-content:center;padding:1.5rem 1rem;}
.lb-img-wrap{display:inline-block;transform-origin:top center;transition:transform .15s;}
.lb-img-wrap img{display:block;width:min(900px,90vw);border-radius:4px;border:1px solid var(--border);}
.lb-zoom-info{font-family:'Rajdhani',sans-serif;font-size:.78rem;color:var(--muted);min-width:3.2rem;text-align:center;}

footer{position:relative;z-index:5;text-align:center;padding:1.5rem;border-top:1px solid var(--border);color:var(--muted);font-size:.72rem;letter-spacing:.08em;}
@media(max-width:640px){.week-rallyes{grid-template-columns:1fr;}.w-rally.right{border-left:none;border-top:1px solid var(--border);}.results-grid{grid-template-columns:1fr;}.header-right{display:none;}}
</style>
</head>

// ══════════════════════════════════════
async function loadVersions(){
  try {
    const r = await fetch(GH_RAW + '?t=' + Date.now());
    if(r.ok){ const d = await r.json(); VERSIONS = d.versions || {}; }
  } catch(e){ VERSIONS = {}; }
}

// ══════════════════════════════════════
// IMAGE URL
// Clé saison 1 : "s1/general/classement_general"
//                "s1/r01/r01_n_general"
//                "s1/r01/r01_r_general"
//                "s1/r01/general"
//                "s1/r01/general_classe"
//                "s1/r01/r01_n_general_classe"
//                "s1/r01/r01_r_general_classe"
//                "s1/r01/n_classe_rally2_r5"
//                "s1/r01/r_classe_rally2_r5"
//                "s1/classes/classe_rally2_r5"
// ══════════════════════════════════════
function imgUrl(key){
  return VERSIONS[key] || null;
}

function mkCard(key, label, chip, chipLabel, date){
  const url = imgUrl(key);
  if(!url) return '';
  const safeLabel = label.replace(/"/g,'&quot;');
  return `<div class="card" data-url="${url}" data-label="${safeLabel}" onclick="openLB(this.dataset.url,this.dataset.label)">
    <div class="card-head"><span class="card-label">${label}</span><span class="card-chip ${chip}">${chipLabel}</span></div>
    <div class="card-img"><img src="${url}" data-key="${key}" alt="${label}" onerror="this.closest('.card').style.display='none'"/></div>
    <div class="card-foot"><span class="card-date">${date}</span><span class="card-cta">Agrandir →</span></div>
  </div>`;
}

// ══════════════════════════════════════
// STATUT RALLYE
// ══════════════════════════════════════
function getRallyeStatus(sid, rid){
  const mainKeys = [
    `${sid}/${rid}/${rid}_n_general`,
    `${sid}/${rid}/${rid}_r_general`,
    `${sid}/${rid}/general`,
    `${sid}/${rid}/general_classe`,
    `${sid}/${rid}/${rid}_n_general_classe`,
    `${sid}/${rid}/${rid}_r_general_classe`,
  ];
  const hasAll = mainKeys.every(k=>VERSIONS[k]);
  const hasAny = mainKeys.some(k=>VERSIONS[k]);
  if(hasAll) return 'done';
  if(hasAny) return 'live';
  // Si rallye précédent est done → live
  const saison = SAISONS.find(s=>s.id===sid);
  if(saison){
    const idx = saison.rallyes.findIndex(r=>r.id===rid);
    if(idx > 0){
      const prevRid = saison.rallyes[idx-1].id;
      const prevKeys = [
        `${sid}/${prevRid}/${prevRid}_n_general`,
        `${sid}/${prevRid}/${prevRid}_r_general`,
        `${sid}/${prevRid}/general`,
        `${sid}/${prevRid}/general_classe`,
        `${sid}/${prevRid}/${prevRid}_n_general_classe`,
        `${sid}/${prevRid}/${prevRid}_r_general_classe`,
      ];
      if(prevKeys.every(k=>VERSIONS[k])) return 'live';
    } else {
      // Premier rallye = live par défaut si saison active
      return 'live';
    }
  }
  return 'upcoming';
}

function getSaisonStatus(sid){
  const saison = SAISONS.find(s=>s.id===sid);
  if(!saison || !saison.rallyes.length) return 'upcoming';
  const hasAny = Object.keys(VERSIONS).some(k=>k.startsWith(sid+'/'));
  if(!hasAny) return 'upcoming';
  const allDone = saison.rallyes.every(r=>getRallyeStatus(sid,r.id)==='done');
  return allDone ? 'done' : 'live';
}

// ══════════════════════════════════════
// BUILD NAV
// ══════════════════════════════════════
function buildNav(){
  const nav = document.getElementById('navInner');
  let html = `<button class="tab-btn tab-cal" onclick="switchTab('cal',this)">📅 Calendrier</button>`;
  SAISONS.forEach(s=>{
    const st = getSaisonStatus(s.id);
    const dot = st==='done'?`<span class="dot dot-done"></span>`:st==='live'?`<span class="dot dot-live"></span>`:'';
    html += `<button class="tab-btn tab-${s.id} active" onclick="switchTab('${s.id}',this)">${dot}${s.label}</button>`;
  });
  nav.innerHTML = html;
  // Activer Saison 1 par défaut
  document.querySelector('.tab-btn.tab-s1').classList.add('active');
}

// ══════════════════════════════════════
// BUILD SAISON PANEL
// ══════════════════════════════════════
function buildSaisonPanel(s){
  const main = document.getElementById('mainContent');
  const st = getSaisonStatus(s.id);
  const stagStr = {done:'stag-done',live:'stag-live',upcoming:'stag-upcoming'};
  const stagLbl = {done:'Terminé',live:'En cours',upcoming:'À venir'};

  // Si saison 2 vide
  if(s.id==='s2' && st==='upcoming'){
    main.insertAdjacentHTML('beforeend',`
      <div class="panel" id="panel-${s.id}">
        <div class="season-header s2">
          <div>
            <div class="season-title s2">${s.title}</div>
            <div class="season-dates">Date affichée dès le 1er upload</div>
          </div>
          <span class="stag stag-upcoming">À venir</span>
        </div>
        <div class="s2-empty">
          <div class="ei">🏁</div>
          <div class="et">Saison 2 non démarrée</div>
          <div class="es">Uploade la 1ère image depuis l'admin → la saison démarre automatiquement</div>
        </div>
      </div>`);
    return;
  }

  const dateStr = s.dateDebut ? `${s.dateDebut}${s.dateFin?' — '+s.dateFin:''}` : 'Date à définir';

  let html = `<div class="panel" id="panel-${s.id}">`;

  // Header saison
  html += `<div class="season-header${s.id==='s2'?' s2':''}">
    <div>
      <div class="season-title${s.id==='s2'?' s2':''}">${s.title}</div>
      <div class="season-dates">${dateStr}</div>
    </div>
    <span class="stag ${stagStr[st]}">${stagLbl[st]}</span>
  </div>`;

  // Sub nav
  html += `<div class="sub-nav" id="subnav-${s.id}">`;
  html += `<button class="sub-btn active" onclick="showSub('${s.id}','gen',this)">🏆 Général</button>`;
  html += `<button class="sub-btn" onclick="showSub('${s.id}','cls',this)">📊 Classes</button>`;
  s.rallyes.forEach(r=>{
    const rst = getRallyeStatus(s.id, r.id);
    const dotHtml = rst==='done'?`<span class="dot dot-done"></span>`:rst==='live'?`<span class="dot dot-live"></span>`:'';
    const cls = rst==='done'?'done':rst==='live'?'live':'';
    html += `<button class="sub-btn ${cls}" onclick="showSub('${s.id}','${r.id}',this)">${dotHtml}${r.label}</button>`;
  });
  html += `</div>`;

  // Sub panels container
  html += `<div id="subpanels-${s.id}">`;

  // Général
  html += `<div class="sub-panel active" id="sub-${s.id}-gen">`;
  html += `<div class="sec-title">Classement Général ${s.label}</div>`;
  const genCards = [
    mkCard(`${s.id}/general/classement_general`, 'Classement Général', 'chip-general', 'Général', s.label),
    mkCard(`${s.id}/general/general_classe`, 'Général par Classe', 'chip-genclasse', 'Gén. Classe', s.label),
  ].join('');
  html += genCards ? `<div class="results-grid">${genCards}</div>` : `<div class="empty-state"><div class="ei">🏆</div><div class="et">Pas encore d'images</div></div>`;
  html += `</div>`;

  // Classes
  html += `<div class="sub-panel" id="sub-${s.id}-cls">`;
  html += `<div class="sec-title">Classements par Classe · ${s.label}</div>`;
  const clsCards = CLASSES.map(c=>mkCard(`${s.id}/classes/classe_${c.key}`, c.label, 'chip-classe', 'Classe', s.label)).join('');
  html += clsCards ? `<div class="results-grid">${clsCards}</div>` : `<div class="empty-state"><div class="ei">📊</div><div class="et">Pas encore d'images</div></div>`;
  html += `</div>`;

  // Rallyes
  s.rallyes.forEach(r=>{
    const rst = getRallyeStatus(s.id, r.id);
    html += `<div class="sub-panel" id="sub-${s.id}-${r.id}">`;
    html += `<div class="rallye-header">
      <span class="rallye-num">${r.label}</span>
      <div>
        <div class="rallye-name">${r.title}</div>
        <div class="rallye-sub"><span style="color:#60a5fa">◼</span> ${r.n}${r.dept_n?' · '+r.dept_n:''} &nbsp;|&nbsp; <span style="color:#f87171">◼</span> ${r.r}${r.dept_r?' · '+r.dept_r:''}</div>
      </div>
      <span class="stag ${stagStr[rst]}" style="margin-left:auto;">${stagLbl[rst]}</span>
    </div>`;

    // Cartes générales
    const rCards = [
      mkCard(`${s.id}/${r.id}/${r.id}_n_general`, r.n, 'chip-general', 'Général', `${r.label} · N`),
      mkCard(`${s.id}/${r.id}/${r.id}_n_general_classe`, `Gén. Classe · ${r.n}`, 'chip-genclasse', 'Gén. Classe', `${r.label} · N`),
      mkCard(`${s.id}/${r.id}/${r.id}_r_general`, r.r, 'chip-general', 'Général', `${r.label} · R`),
      mkCard(`${s.id}/${r.id}/${r.id}_r_general_classe`, `Gén. Classe · ${r.r}`, 'chip-genclasse', 'Gén. Classe', `${r.label} · R`),
      mkCard(`${s.id}/${r.id}/general`, `Classement Général ${r.label}`, 'chip-general', 'Général', r.label),
      mkCard(`${s.id}/${r.id}/general_classe`, `Général par Classe ${r.label}`, 'chip-genclasse', 'Gén. Classe', r.label),
    ].join('');

    if(rCards){
      html += `<div class="sec-title">Résultats ${r.label}</div>`;
      html += `<div class="results-grid">${rCards}</div>`;
    }

    // Classes Nationale
    const clsN = CLASSES.map(c=>mkCard(`${s.id}/${r.id}/n_classe_${c.key}`, c.label, 'chip-classe', 'Classe', `${r.label} · N`)).join('');
    if(clsN){
      html += `<div class="sec-title">Classes · ${r.n} <span style="color:#60a5fa;font-size:.6rem">◼ Nationale</span></div>`;
      html += `<div class="results-grid">${clsN}</div>`;
    }

    // Classes Régionale
    const clsR = CLASSES.map(c=>mkCard(`${s.id}/${r.id}/r_classe_${c.key}`, c.label, 'chip-classe', 'Classe', `${r.label} · R`)).join('');
    if(clsR){
      html += `<div class="sec-title">Classes · ${r.r} <span style="color:#f87171;font-size:.6rem">◼ Régionale</span></div>`;
      html += `<div class="results-grid">${clsR}</div>`;
    }

    if(!rCards && !clsN && !clsR){
      html += `<div class="empty-state"><div class="ei">🏁</div><div class="et">Résultats disponibles après le rallye</div></div>`;
    }

    html += `</div>`;
  });

  html += `</div></div>`;
  main.insertAdjacentHTML('beforeend', html);
}

// ══════════════════════════════════════
// BUILD CALENDAR
// ══════════════════════════════════════
function buildCalendar(){
  const g = document.getElementById('calGrid');
  const wsC={done:'ws-done',live:'ws-live',upcoming:'ws-upcoming'};
  const wsL={done:'Terminé',live:'En cours',upcoming:'À venir'};
  SAISONS[0].rallyes.forEach(r=>{
    const st = getRallyeStatus('s1', r.id);
    g.innerHTML += `<div class="week-block">
      <div class="week-head">
        <span class="week-num">${r.label}</span>
        <span class="week-label">${r.title}</span>
        <span class="week-status ${wsC[st]}">${wsL[st]}</span>
      </div>
      <div class="week-rallyes">
        <div class="w-rally left">
          <div class="rtype rtype-n">◼ Nationale</div>
          <div class="rname">${r.n}</div>
          ${r.dept_n?`<div class="rdept">${r.dept_n}</div>`:''}
        </div>
        <div class="w-rally right">
          <div class="rtype rtype-r">◼ Régionale</div>
          <div class="rname">${r.r}</div>
          ${r.dept_r?`<div class="rdept">${r.dept_r}</div>`:''}
        </div>
      </div>
    </div>`;
  });
}

// ══════════════════════════════════════
// TABS
// ══════════════════════════════════════
function switchTab(id, btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const p = document.getElementById('panel-'+id);
  if(p) p.classList.add('active');
  if(btn) btn.classList.add('active');
}

function showSub(sid, subId, btn){
  document.querySelectorAll(`#subpanels-${sid} .sub-panel`).forEach(p=>p.classList.remove('active'));
  document.querySelectorAll(`#subnav-${sid} .sub-btn`).forEach(b=>b.classList.remove('active'));
  const p = document.getElementById(`sub-${sid}-${subId}`);
  if(p) p.classList.add('active');
  if(btn) btn.classList.add('active');
}

// ══════════════════════════════════════
// LIGHTBOX
// ══════════════════════════════════════
let lbScale = 1;
function openLB(src, title){
  lbScale=1;
  document.getElementById('lbImg').src=src;
  document.getElementById('lbTitle').textContent=title;
  document.getElementById('lbWrap').style.transform='scale(1)';
  document.getElementById('lbZoomInfo').textContent='100%';
  document.getElementById('lbScroll').scrollTop=0;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow='hidden';
}
function lbZoom(d){
  lbScale=Math.min(4,Math.max(0.5,lbScale+d));
  document.getElementById('lbWrap').style.transform=`scale(${lbScale})`;
  document.getElementById('lbWrap').style.transformOrigin='top center';
  document.getElementById('lbZoomInfo').textContent=Math.round(lbScale*100)+'%';
}
function lbReset(){
  lbScale=1;
  document.getElementById('lbWrap').style.transform='scale(1)';
  document.getElementById('lbZoomInfo').textContent='100%';
  document.getElementById('lbScroll').scrollTop=0;
}
function closeLB(){
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLB();});
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('lbScroll').addEventListener('wheel',e=>{
    if(!document.getElementById('lightbox').classList.contains('open'))return;
    e.preventDefault();
    lbZoom(e.deltaY<0?0.15:-0.15);
  },{passive:false});
  document.getElementById('lbScroll').addEventListener('click',e=>{
    if(e.target===document.getElementById('lbScroll'))closeLB();
  });
});

// ══════════════════════════════════════
// AUTO-REFRESH 10s
// ══════════════════════════════════════
setInterval(async()=>{
  try{
    const r=await fetch(GH_RAW+'?t='+Date.now());
    if(!r.ok)return;
    const d=await r.json();
    const newV=d.versions||{};
    let changed=false;
    Object.keys(newV).forEach(k=>{
      if(newV[k]!==VERSIONS[k]){
        VERSIONS[k]=newV[k];
        changed=true;
        document.querySelectorAll(`img[data-key="${k}"]`).forEach(img=>{
          img.src=newV[k];
          img.closest('.card').style.display='';
        });
      }
    });
    Object.keys(VERSIONS).forEach(k=>{
      if(!newV[k]){
        delete VERSIONS[k];
        document.querySelectorAll(`img[data-key="${k}"]`).forEach(img=>{
          img.closest('.card').style.display='none';
        });
      }
    });
  }catch(e){}
},10000);

// ══════════════════════════════════════
// BROADCAST
// ══════════════════════════════════════
try{
  const bc=new BroadcastChannel('afrl_updates');
  bc.onmessage=(e)=>{
    const{key,url,deleted}=e.data;
    if(!key)return;
    if(deleted){
      delete VERSIONS[key];
      document.querySelectorAll(`img[data-key="${key}"]`).forEach(img=>{img.closest('.card').style.display='none';});
    }else if(url){
      VERSIONS[key]=url;
      document.querySelectorAll(`img[data-key="${key}"]`).forEach(img=>{img.src=url;img.closest('.card').style.display='';});
    }
  };
}catch(e){}

// ══════════════════════════════════════
// INIT
// ══════════════════════════════════════
const cached=localStorage.getItem('afrl_versions_cache');
if(cached){try{VERSIONS=JSON.parse(cached);}catch(e){}}

buildNav();
SAISONS.forEach(s=>buildSaisonPanel(s));
buildCalendar();
// Activer Saison 1 par défaut
switchTab('s1', document.querySelector('.tab-btn.tab-s1'));

loadVersions().then(()=>{
  localStorage.setItem('afrl_versions_cache',JSON.stringify(VERSIONS));
  document.querySelectorAll('img[data-key]').forEach(img=>{
    const key=img.dataset.key;
    const url=VERSIONS[key];
    if(url&&img.src!==url){img.src=url;img.closest('.card').style.display='';}
    else if(!url){img.closest('.card').style.display='none';}
  });
  // Rebuild nav avec statuts à jour
  buildNav();
  switchTab('s1', document.querySelector('.tab-btn.tab-s1'));
});
